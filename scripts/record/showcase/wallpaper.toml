# Showcase config for the wallpaper plugin preview: one image, full
# region. The path is repo-relative like sakura.toml's, so launch from
# the repo root (VEILAND_CONFIG=scripts/record/showcase/wallpaper.toml
# veiland). Static, so a screenshot is enough.

[[plugin]]
name = "wallpaper"
binary = "veiland-wallpaper"
z_index = 0

[plugin.config]
path = "docs/examples/assets/sakura-dusk.jpg"
# blur applies to the WHOLE surface; blur_regions are the frosted "cards"
# darkened on top of that blurred base. radius rounds a region's corners
# (fraction of surface height, 0 = square); darken is the per-card tint
# (falls back to the global `darken` when omitted). This is the layout20
# look: blurred wallpaper everywhere, darker rounded cards over it.
blur = 8
darken = 0.4
blur_regions = [
  { x = 0.05, y = 0.1, w = 0.25, h = 0.8, radius = 0.03, darken = 0.7 },
  { x = 0.65, y = 0.6, w = 0.3,  h = 0.3, radius = 0.04, darken = 0.7 },
]