#
# veiland-shader, "nebula" preset - a bare single-plugin scene for trying
# the shader in isolation. Layered value-noise clouds drifting through a
# deep-space palette, filling the whole surface.
#
# Thermal defaults: full render scale (nebula is cheap) capped at 30 fps.
# Lower render_scale or max_fps for an unattended lock; raise for capture.

[[plugin]]
name = "shader"
binary = "veiland-shader"
z_index = 0

[plugin.config]
# Embedded preset shipped in the binary. Also try "warp" or "plasma".
preset = "nebula"
# Buffer resolution as a fraction of the region; the locker upsamples.
render_scale = 1.0
# Cap on submitted frames per second. 0 = compositor rate.
max_fps = 30

# --- Password field: a simple pill readable over the clouds ----------
[password]
y_percent = 68
box_width = 440
box_height = 70
outline_thickness = 2
rounding = -1                              # full pill
inner_color = "rgba(16, 20, 34, 0.50)"
outer_color = "rgba(150, 170, 200, 0.45)"
dot_color = "rgba(235, 238, 245, 1.0)"
dot_diameter = 10
dot_spacing = 22
