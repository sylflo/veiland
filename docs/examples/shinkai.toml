# SPDX-License-Identifier: GPL-3.0-or-later
#
# Mockup scene — Shinkai movies, scene 1 ("Your Name").
#
# Composes the reference plugins (wallpaper, vignette, particles) plus
# several `veiland-markup` instances for the movie title, the quote, and
# the clock. Z-order (back to front):
#
#   0  wallpaper       (background image)
#   10 vignette        (darkens corners)
#   20 particles       (drifting white/yellow dots)
#   30 title-english   (small, dim)
#   31 title-japanese  (large, bright)
#   40 quote-english   (italic-equivalent line)
#   41 quote-japanese  (small, dim)
#   50 clock           (time + date in upper-left)
#
# The password field (input box + dots) paints on top of everything via
# the core's fixed paint order (not z-controlled). The [password] table
# at the end of this file tunes it to the mockup's pill.
#
# Asset path notes:
#
# * Wallpapers: THIS SCENE SHIPS NO WALLPAPER IMAGES. It was built around
#   Makoto Shinkai film stills ("Your Name"), which are copyrighted (CoMix
#   Wave Films) and cannot be redistributed, so the two `path` values below
#   are placeholders. Supply your own two images (one per monitor) and set
#   both paths to their absolute locations. Anything PNG or JPEG works; any
#   dusk-sky / anime-landscape wallpaper fits the scene. If a path is wrong
#   the wallpaper plugin just paints black and logs it, and the rest of the
#   scene (vignette, particles, sakura, labels, clock, pill) still renders.
#
# * Fonts: the labels ask for "Noto Sans CJK JP" — present on most
#   distros via the noto-fonts-cjk package. Latin glyphs render from
#   the same family; Japanese glyphs render from the CJK subset.
#   `fc-list :lang=ja` must report it or the title/quote labels
#   render tofu.
#
# Visible-vs-mockup differences:
#
# * (none affecting motion) Particles/sakura animate at the compositor
#   refresh rate — measured ~55-60 fps per output. An older note here
#   claimed ~10 fps; that was the pre-explicit-sync eglSwapBuffers stall,
#   since fixed. Per-plugin frame rate (a plugin choosing its own slower
#   rate) is still a deferred limitation, but does not slow motion.
#
# Letter-spacing, font-weight, and italics match the mockup: each markup
# line carries them as inline Pango <span> attributes (letter_spacing in
# Pango units, weight as a number), and the clock's <span> scales the time
# up from the base size. The English quote is italic via "Liberation Sans"
# (a family with a real italic face — CJK Noto has none).

# --- Wallpaper: edge-to-edge image ---------------------------------
[[plugin]]
name = "wallpaper"
binary = "veiland-wallpaper"
monitors = ["HDMI-A-1"]
z_index = 0

[plugin.config]
# Placeholder: set to your own wallpaper for this monitor (absolute path).
path = "/home/you/.config/veiland/shinkai-1.jpg"


# --- Wallpaper: edge-to-edge image ---------------------------------
[[plugin]]
name = "wallpaper-2"
binary = "veiland-wallpaper"
monitors = ["DP-1"]
z_index = 0

[plugin.config]
# Placeholder: set to your own wallpaper for this monitor (absolute path).
path = "/home/you/.config/veiland/shinkai-2.jpg"


# --- Vignette: soft corner darkening -------------------------------
[[plugin]]
name = "vignette"
binary = "veiland-vignette"
z_index = 10

[plugin.config]
color = [0.0, 0.0, 0.0, 1.0]
opacity_top_left = 0.55
opacity_top_right = 0.55
opacity_bottom_left = 0.65
opacity_bottom_right = 0.65
radius = 1.3
# Soft whole-image dim under the corner gradient — the dreamy haze.
base_opacity = 0.2

# --- Particles: drifting motes --------------------------------------
[[plugin]]
name = "particles"
binary = "veiland-particles"
z_index = 20
monitors = ["DP-1"]

[plugin.config]
count = 40
# Mockup uses translucent white; tune brighter if you want them to
# read more clearly against this specific wallpaper.
color = [1.0, 1.0, 1.0, 1.0]
# Core radius in logical px (the glow halo extends ~3x beyond it).
# The plugin default of 0.4 reads too small on this scene, and the
# gallery GIF downscales to ~600px wide — size for that, not 1:1.
radius_px = 1.5

# --- Sakura: falling cherry-blossom petals --------------------------
[[plugin]]
name = "sakura"
binary = "veiland-sakura"
z_index = 25
monitors = ["HDMI-A-1"]


[plugin.config]
count = 25
size_px = 22
# White tint = use the petal PNG's own pink. Lower alpha to soften.
color = [1.0, 1.0, 1.0, 1.0]

# --- Title (English) — small, dim, above the Japanese title --------
[[plugin]]
name = "title-english"
binary = "veiland-markup"
z_index = 30
# Region spans the width and is anchored so the centered line sits just above
# the Japanese title (matched to the mockup's vertical layout). letter_spacing
# and weight are inline <span> attributes (Pango units, 1024 per px).
region = { halign = "center", valign = "top", width = 1.0, height = 0.04, margin_y = 0.328 }

[plugin.config]
text = '<span weight="300" letter_spacing="6144">YOUR NAME</span>'
font_family = "Noto Sans CJK JP"
font_size = 0.44             # base size as a fraction of region height (~17px)
content_halign = "center"
content_valign = "center"
text_color = [0.91, 0.96, 0.97, 0.6]
shadow_color = [0.0, 0.0, 0.0, 0.8]

# --- Title (Japanese) — large, bright, the main visual -------------
[[plugin]]
name = "title-japanese"
binary = "veiland-markup"
z_index = 31
region = { halign = "center", valign = "top", width = 1.0, height = 0.06, margin_y = 0.36 }

[plugin.config]
text = '<span weight="300" letter_spacing="8192">君の名は。</span>'
font_family = "Noto Sans CJK JP"
font_size = 0.63             # base size as a fraction of region height (~38px)
content_halign = "center"
content_valign = "center"
text_color = [0.91, 0.96, 0.97, 0.95]
shadow_color = [0.0, 0.0, 0.0, 0.9]

# --- Quote (English) — below the title -----------------------------
[[plugin]]
name = "quote-english"
binary = "veiland-markup"
z_index = 40
region = { halign = "center", valign = "top", width = 1.0, height = 0.04, margin_y = 0.487 }

[plugin.config]
text = "Once in a while when I wake up, I find myself crying."
# Italic to match the mockup. PangoCairo selects a real italic FACE, and
# "Noto Sans CJK JP" ships no italic, so this Latin-only line uses "Liberation
# Sans" which has one. Swap to any family with an installed italic face.
font_family = "Liberation Sans"
font_size = 0.55             # base size as a fraction of region height (~24px)
font_weight = 300
italic = true
content_halign = "center"
content_valign = "center"
text_color = [0.91, 0.96, 0.97, 0.9]
shadow_color = [0.0, 0.0, 0.0, 0.9]

# --- Quote (Japanese) — smaller, dimmer, below the English quote ---
[[plugin]]
name = "quote-japanese"
binary = "veiland-markup"
z_index = 41
region = { halign = "center", valign = "top", width = 1.0, height = 0.04, margin_y = 0.541 }

[plugin.config]
text = '<span letter_spacing="3072">たまに、目が覚めると泣いている</span>'
font_family = "Noto Sans CJK JP"
font_size = 0.45             # base size as a fraction of region height (~19px)
content_halign = "center"
content_valign = "center"
text_color = [0.91, 0.96, 0.97, 0.7]
shadow_color = [0.0, 0.0, 0.0, 0.8]

# --- Clock (markup): time + date, upper-left, above everything -----
# A {time}/{date} markup block parked top-left. The inline <span> scales the
# time up from the base (date) size and carries the per-line letter_spacing
# (Pango units); weight 100 is fine here -- it's Noto CJK, not the thin-digit
# case that afflicted the old clock with "Sans".
[[plugin]]
name = "clock"
binary = "veiland-markup"
z_index = 50
region = { halign = "left", valign = "top", width = 0.5, height = 0.2, margin_x = 0.026, margin_y = 0.046 }

[plugin.config]
text = '''<span size="460%" letter_spacing="4096">{time:%H:%M}</span>
<span letter_spacing="2048" foreground="#ffffff">{date:%B %d, %Y}</span>'''
font_family = "Noto Sans CJK JP"
font_weight = 100
font_size = 0.06             # base (date) size as a fraction of region height
content_halign = "left"
content_valign = "top"
text_color = [0.91, 0.96, 0.97, 0.9]
shadow_color = [0.0, 0.0, 0.0, 0.9]

# --- Password field: the input box + dots --------------------------
# Tuned to the mockup: a wide, low, fully-rounded pill with a dark
# translucent fill, a faint light outline, and small white dots. The
# box auto-centres the dots, so y_percent positions both. Painted by
# the core on top of every plugin above.
[password]
y_percent = 63
box_width = 440
box_height = 70
outline_thickness = 2
rounding = -1                              # full pill
inner_color = "rgba(28, 36, 52, 0.45)"
outer_color = "rgba(150, 170, 200, 0.45)"
dot_color = "rgba(235, 238, 245, 1.0)"
dot_diameter = 10
dot_spacing = 22
# Placeholder hint shown until the first keystroke. Italic-leaning
# family for the dreamy vibe; "" would leave the box empty.
placeholder_text = "Enter to remember..."
placeholder_color = "rgba(220, 225, 235, 0.55)"
placeholder_font_family = "Liberation Sans"
placeholder_font_size = 17
